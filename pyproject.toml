[project]
name = "git2tweet"
version = "0.1.0"
description = "Turn your git commits into tweet drafts with an AI agent and human approval"
readme = "README.md"
authors = [
    { name = "Vedant", email = "vkowdiki@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "platformdirs>=4.12.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
git2tweet = "git2tweet.cli:main"

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
